title: IAM Administrator Policy Attachment Outside Business Hours
id: 8a4b3c2d-1e5f-4a7b-9c8d-2f3e4a5b6c7d
status: experimental
description: Detecta adhesion de AdministratorAccess a usuario IAM fuera de horario 00:00-06:00 UTC. Coincide con incidente FleetSec T+00:22.
references:
  - https://attack.mitre.org/techniques/T1098/
author: FleetSec Security Team
date: 2026/09/13
tags:
  - attack.privilege_escalation
  - attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: AttachUserPolicy
    requestParameters.policyArn: 'arn:aws:iam::aws:policy/AdministratorAccess'
  timeframe:
    - 00:00-06:00 UTC
  condition: selection
falsepositives:
  - Mantenimiento programado autorizado
level: high
