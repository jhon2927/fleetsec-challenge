name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 1. SAST con Semgrep
      - name: Semgrep SAST
        run: |
          docker run --rm -v $PWD:/src returntocorp/semgrep \
            --config=p/security-audit \
            --config=.semgrep-rules/ \
            --severity=CRITICAL,HIGH \
            --error || true

      # 2. SCA con Trivy
      - name: Trivy SCA
        run: |
          docker run --rm -v $PWD:/app aquasec/trivy \
            fs --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed /app || true

      # 3. SBOM con CycloneDX
      - name: Generate SBOM
        run: |
          mkdir -p reports
          docker run --rm -v $PWD:/app cyclonedx/cyclonedx-cli \
            --input /app/src/package.json \
            --output /app/reports/sbom.json \
            --format json

      # 4. Secrets con Gitleaks
      - name: Gitleaks Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Levantar app para DAST
      - name: Start app for DAST
        run: |
          cd src
          npm install
          nohup node app.js > /tmp/app.log 2>&1 &
          sleep 15
          curl -s http://localhost:3000 || echo "App no responde"

      # 6. DAST con OWASP ZAP
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: true

      # 7. Container Scan con Trivy
      - name: Trivy Container Scan
        run: |
          docker build -t fleetsec-app ./src
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity CRITICAL --exit-code 1 \
            fleetsec-app:latest || true

      # 8. Subir reportes como artifact
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
